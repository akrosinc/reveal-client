// Top-level build file

buildscript {
    ext {
        kotlin_version = '1.7.22'
        android_gradle_plugin = '7.3.1'
        jacoco_version = '0.8.6'
    }

    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        mavenLocal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_plugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "gradle.plugin.org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.10.2"
        classpath 'com.google.gms:google-services:4.3.8'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.4.1'
        classpath 'com.google.firebase:perf-plugin:1.3.4'
    }
}

allprojects {
    group = 'org.smartregister'

    ext {
        androidCompileSdkVersion = 28
        androidBuildToolsVersion = '28.0.3'
        androidMinSdkVersion = 16
        androidTargetSdkVersion = 28
        androidAnnotationsVersion = '3.0.1'
    }

    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://repo.maven.apache.org/maven2" }
        mavenLocal()
    }
}

subprojects {

    // Common Android Library/App configuration
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            project.android.compileSdkVersion = rootProject.ext.androidCompileSdkVersion
            project.android.buildToolsVersion = rootProject.ext.androidBuildToolsVersion

            project.android.defaultConfig {
                minSdkVersion rootProject.ext.androidMinSdkVersion
                targetSdkVersion rootProject.ext.androidTargetSdkVersion
            }

            project.android.dexOptions {
                javaMaxHeapSize = "4g"
            }

            project.android.lintOptions {
                abortOnError false
            }
        }
    }

    // Jacoco defaults
    project.plugins.withId('jacoco') {
        jacoco {
            toolVersion = rootProject.ext.jacoco_version
        }
    }
}

// Common dependency versions
ext.libs = [
        junit           : "junit:junit:4.12",
        robolectric     : "org.robolectric:4.3.1",
        powermock       : "org.powermock:powermock-module-junit4:2.0.0",
        gson            : "com.google.code.gson:gson:2.8.2",
        appcompat       : "androidx.appcompat:appcompat:1.2.0",
        material        : "com.google.android.material:material:1.2.1",
        recyclerview    : "androidx.recyclerview:recyclerview:1.1.0",
        spinKit         : "com.github.ybq:Android-SpinKit:1.4.0",
        acra            : "ch.acra:acra:4.5.0"
]