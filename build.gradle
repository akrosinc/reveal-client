// Top-level build file

buildscript {
    ext {
        kotlin_version = '1.9.24'
        android_gradle_plugin = '8.5.2'
        jacoco_version = '0.8.11'

    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        mavenLocal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_plugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "gradle.plugin.org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.10.2"
        classpath 'com.google.gms:google-services:4.3.8'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.4.1'
        classpath 'com.google.firebase:perf-plugin:1.3.4'
    }
}

allprojects {
    group = 'org.smartregister'

    ext {
        androidCompileSdkVersion = 34
        androidBuildToolsVersion = '34.0.0'
        androidMinSdkVersion = 26
        androidTargetSdkVersion = 34
        androidAnnotationsVersion = '3.0.1'
        androidToolsBuildGradle = '8.5.2'
    }

    Properties githubProps = new Properties()
    File githubPropsFile = rootProject.file("local.properties")
    if (githubPropsFile.exists()) {
        githubProps.load(new FileInputStream(githubPropsFile))
    }
    def stripQuotes = { String s -> s == null ? null : s.trim().replaceAll('^"|"$', '') }
    def ghUser = stripQuotes(githubProps.getProperty("githubUsername") ?: githubProps.getProperty("username")) ?: System.getenv("GITHUB_USER")
    def ghToken = stripQuotes(githubProps.getProperty("githubToken") ?: githubProps.getProperty("password")) ?: System.getenv("GITHUB_TOKEN")

    repositories {
        maven {
            url = uri("https://maven.pkg.github.com/akrosinc/maven-repo")
            credentials {
                username = ghUser
                password = ghToken
            }
        }
        // Upgraded artifacts (com.akrosinc:*) published during the modernization
        maven {
            url = uri("https://maven.pkg.github.com/akrosinc/upgrade-repo")
            credentials {
                username = ghUser
                password = ghToken
            }
        }
        google()

        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://repo.maven.apache.org/maven2" }
        mavenLocal()
    }
}

subprojects {

    // Common Android Library/App configuration
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            project.android.compileSdkVersion = rootProject.ext.androidCompileSdkVersion
            project.android.buildToolsVersion = rootProject.ext.androidBuildToolsVersion

            project.android.defaultConfig {
                minSdkVersion rootProject.ext.androidMinSdkVersion
                targetSdkVersion rootProject.ext.androidTargetSdkVersion
            }



            project.android.lintOptions {
                abortOnError false
            }
        }
    }

    // Jacoco defaults
    project.plugins.withId('jacoco') {
        jacoco {
            toolVersion = rootProject.ext.jacoco_version
        }
    }
}

// Common dependency versions
ext.libs = [
        junit           : "junit:junit:4.12",
        robolectric     : "org.robolectric:4.3.1",
        powermock       : "org.powermock:powermock-module-junit4:2.0.0",
        gson            : "com.google.code.gson:gson:2.8.2",
        appcompat       : "androidx.appcompat:appcompat:1.2.0",
        material        : "com.google.android.material:material:1.2.1",
        recyclerview    : "androidx.recyclerview:recyclerview:1.1.0",
        spinKit         : "com.github.ybq:Android-SpinKit:1.4.0",
        acra            : "ch.acra:acra:4.5.0"
]