import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.3.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.4.1'
        classpath 'com.google.firebase:perf-plugin:1.3.4'
    }

}

allprojects {
    Properties githubProps = new Properties()
    File githubPropsFile = rootProject.file("local.properties")
    if (githubPropsFile.exists()) {
        githubProps.load(new FileInputStream(githubPropsFile))
    }
    def stripQuotes = { String s -> s == null ? null : s.trim().replaceAll('^"|"$', '') }
    def ghUser = stripQuotes(githubProps.getProperty("githubUsername") ?: githubProps.getProperty("username")) ?: System.getenv("GITHUB_USER")
    def ghToken = stripQuotes(githubProps.getProperty("githubToken") ?: githubProps.getProperty("password")) ?: System.getenv("GITHUB_TOKEN")

    repositories {
        maven {
            url = uri("https://maven.pkg.github.com/akrosinc/maven-repo")
            credentials {
                username = ghUser
                password = ghToken
            }
        }
        // Upgraded artifacts (com.akrosinc:*)
        maven {
            url = uri("https://maven.pkg.github.com/akrosinc/upgrade-repo")
            credentials {
                username = ghUser
                password = ghToken
            }
        }
        mavenCentral()
        mavenLocal()
        maven { url 'https://maven.google.com' }
//        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url "https://repo.grails.org/grails/core/" }
        maven { url "https://artifactory.appodeal.com/appodeal/" }
        maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
        google()

    }
    configurations.all {
        resolutionStrategy.force 'commons-codec:commons-codec:1.10'
        // Guava ships ListenableFuture and there is also an empty stub module
        // (com.google.guava:listenablefuture:1.0) pulled in transitively; drop the
        // stub to avoid duplicate-class errors with full guava.
        exclude group: 'com.google.guava', module: 'listenablefuture'
        // Pin Kotlin stdlib + androidx.annotation to versions whose metadata the
        // project's Kotlin compiler (1.9.x) can read. Transitive deps otherwise
        // pull kotlin-stdlib 2.1.x / annotation-jvm 1.10 (Kotlin 2.1 metadata).
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
            force 'androidx.annotation:annotation:1.7.1'
            force 'androidx.annotation:annotation-jvm:1.7.1'
            // Mapbox's bundled com.mapbox.mapboxsdk:mapbox-android-core:2.0.1
            // (via mapbox-android-sdk 9.2.0 -> mapbox-android-telemetry 5.0.1)
            // was compiled against a play-services-location where
            // FusedLocationProviderClient is a CLASS. play-services-location
            // 18.0.0+ turned it into an INTERFACE, causing
            // IncompatibleClassChangeError in GoogleLocationEngineImpl at runtime.
            // Pin location to the last class-form line; base/basement/tasks stay
            // at 18.x independently (the class/interface change lives only in
            // play-services-location).
            force 'com.google.android.gms:play-services-location:17.1.0'
        }
    }

}


