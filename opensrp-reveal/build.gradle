tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    maxHeapSize = "4g"

    testLogging {
        events TestLogEvent.FAILED
        exceptionFormat TestExceptionFormat.FULL
        showCauses true
        showExceptions true
        showStackTraces true
