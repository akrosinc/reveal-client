apply plugin: 'com.android.library'
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.11"
}

android {
    namespace 'org.smartregister.p2p'
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion

    defaultConfig {
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {

        debug {
            testCoverageEnabled true
            minifyEnabled false
        }

        release {
            minifyEnabled false
            testCoverageEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions.unitTests.includeAndroidResources = true
    lint.abortOnError = false

    // The Nearby Connections unit tests below mock obfuscated Play Services
    // internals whose shadows no longer compile against play-services-nearby 18.x.
    // They are excluded from unit-test compilation until rewritten against the
    // public ConnectionsClient API.
    sourceSets {
        test {
            java {
                exclude '**/shadows/ShadowNearby.java'
                exclude '**/shadows/Shadowzzbd.java'
                exclude '**/interactor/P2pModeSelectInteractorTest.java'
            }
        }
    }
}

dependencies {
    def room_version = '2.6.1'

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-nearby:18.7.0'
    implementation ('com.google.android.gms:play-services-location:21.3.0') {
        exclude group: 'androidx.legacy', module: 'legacy-support-v4'
    }

    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation "org.robolectric:robolectric:4.11.1"

    // ZXING DEPENDENCIES
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        exclude group: 'androidx.legacy', module: 'legacy-support-v4'
    }
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Room (AndroidX)
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    // Room Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // Encrypted SQLite help (AndroidX-compatible SafeRoom)
    implementation "com.commonsware.cwac:saferoom.x:1.3.0"
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {

    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = file("${buildDir}/reports/jacoco/jacocoRootReport/merged.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/jacocoRootReport/html")
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*', '**/*$ViewBinder*.*']
    def debugTree = fileTree(dir: "$project.buildDir/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ]))
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}
